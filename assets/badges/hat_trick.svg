<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Soft Elegant Studio Lighting Background -->
    <radialGradient id="ht-soft-bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2a386b"/>
      <stop offset="50%" stop-color="#182245"/>
      <stop offset="100%" stop-color="#0b1024"/>
    </radialGradient>

    <!-- Super Shiny 24K Polished Gold Gradient -->
    <linearGradient id="ht-gold-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#FFF4A3"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#E5A100"/>
      <stop offset="90%" stop-color="#B37400"/>
      <stop offset="100%" stop-color="#664000"/>
    </linearGradient>

    <!-- Electric Cyan Crystal Gradient -->
    <linearGradient id="ht-cyan-vibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6FAFF"/>
      <stop offset="25%" stop-color="#00F0FF"/>
      <stop offset="70%" stop-color="#0094FF"/>
      <stop offset="100%" stop-color="#004DA6"/>
    </linearGradient>

    <radialGradient id="ht-cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="ht-3d-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00F0FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Soft Ambient Backdrop -->
  <rect width="200" height="200" rx="36" fill="url(#ht-soft-bg)"/>
  
  <!-- Ambient Plasma Glow -->
  <circle cx="100" cy="95" r="70" fill="url(#ht-cyan-glow)" opacity="0.35"/>

  <g filter="url(#ht-3d-shadow)">
    <!-- Aerodynamic 3D Shield Frame (Polished Gold & Cyan) -->
    <polygon points="100,16 172,48 160,154 100,186 40,154 28,48" fill="url(#ht-gold-shine)"/>
    
    <!-- Dark Titanium Inner Bevel -->
    <polygon points="100,22 165,52 154,148 100,180 46,148 35,52" fill="#0C1A2E"/>
    
    <!-- Deep Sapphire Crystal Shield -->
    <polygon points="100,28 158,56 148,142 100,172 52,142 42,56" fill="url(#ht-cyan-vibrant)"/>

    <!-- Crystal Facet Reflections -->
    <polygon points="100,28 158,56 100,98 42,56" fill="#FFFFFF" opacity="0.3"/>
    <polygon points="42,56 100,98 52,142" fill="#FFFFFF" opacity="0.15"/>
    <polygon points="100,98 148,142 100,172 52,142" fill="#04203D" opacity="0.7"/>

    <!-- Inner Shield Cavity -->
    <polygon points="100,42 144,68 136,132 100,156 64,132 56,68" fill="#061629" stroke="url(#ht-gold-shine)" stroke-width="1.8"/>

    <!-- 3D Triple Crown / Triple Arrow Hat-Trick Emblem -->
    <g transform="translate(0, 0)">
      <!-- 1. Center Top Main Arrow / Spear -->
      <g transform="translate(100, 68)">
        <polygon points="0,-22 9,14 0,10 -9,14" fill="url(#ht-gold-shine)"/>
        <polygon points="0,-22 4,12 0,10 -4,12" fill="#FFFFFF"/>
        <line x1="0" y1="-20" x2="0" y2="28" stroke="url(#ht-gold-shine)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="0" cy="-22" r="3" fill="#FFFFFF"/>
      </g>

      <!-- 2. Left Flanking Arrow / Spear -->
      <g transform="translate(74, 96) rotate(-28)">
        <polygon points="0,-18 8,10 0,7 -8,10" fill="url(#ht-gold-shine)"/>
        <polygon points="0,-18 3,9 0,7 -3,9" fill="#FFFFFF"/>
        <line x1="0" y1="-16" x2="0" y2="24" stroke="url(#ht-gold-shine)" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="0" cy="-18" r="2.5" fill="#FFFFFF"/>
      </g>

      <!-- 3. Right Flanking Arrow / Spear -->
      <g transform="translate(126, 96) rotate(28)">
        <polygon points="0,-18 8,10 0,7 -8,10" fill="url(#ht-gold-shine)"/>
        <polygon points="0,-18 3,9 0,7 -3,9" fill="#FFFFFF"/>
        <line x1="0" y1="-16" x2="0" y2="24" stroke="url(#ht-gold-shine)" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="0" cy="-18" r="2.5" fill="#FFFFFF"/>
      </g>

      <!-- Central Power Diamond Node linking the 3 Strikes -->
      <polygon points="100,94 112,106 100,118 88,106" fill="url(#ht-gold-shine)" stroke="#FFFFFF" stroke-width="1.5"/>
      <polygon points="100,98 108,106 100,114 92,106" fill="#00F0FF"/>
      <circle cx="100" cy="106" r="3" fill="#FFFFFF"/>
    </g>

    <!-- 3 Glowing Golden Hat-Trick Victory Stars at Base -->
    <g transform="translate(100, 142)">
      <!-- Center Star -->
      <polygon points="0,-8 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2" fill="url(#ht-gold-shine)"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
      <!-- Left Star -->
      <polygon points="-18,-6 -16,-1 -11,-1 -15,2 -13,7 -18,4 -23,7 -21,2 -25,-1 -20,-1" fill="url(#ht-gold-shine)" opacity="0.9"/>
      <!-- Right Star -->
      <polygon points="18,-6 20,-1 25,-1 21,2 23,7 18,4 13,7 15,2 11,-1 16,-1" fill="url(#ht-gold-shine)" opacity="0.9"/>
    </g>

    <!-- Apex Diamond Light -->
    <polygon points="100,16 106,26 100,24 94,26" fill="#FFFFFF"/>
  </g>
</svg>
