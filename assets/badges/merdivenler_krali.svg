<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Soft Elegant Studio Lighting Background -->
    <radialGradient id="mk-soft-bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b2d66"/>
      <stop offset="50%" stop-color="#241b44"/>
      <stop offset="100%" stop-color="#140f29"/>
    </radialGradient>

    <!-- Super Shiny 24K Polished Gold Gradient -->
    <linearGradient id="mk-gold-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#FFF4A3"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#E5A100"/>
      <stop offset="90%" stop-color="#B37400"/>
      <stop offset="100%" stop-color="#664000"/>
    </linearGradient>

    <!-- Gold Highlight Gradient -->
    <linearGradient id="mk-gold-top" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Vibrant Emerald Crystal Gradient -->
    <linearGradient id="mk-emerald-vibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72FFC2"/>
      <stop offset="30%" stop-color="#00FF87"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#024D34"/>
    </linearGradient>

    <radialGradient id="mk-emerald-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows & Specular Glows -->
    <filter id="mk-3d-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFD700" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Soft Ambient Backdrop -->
  <rect width="200" height="200" rx="36" fill="url(#mk-soft-bg)"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="100" cy="95" r="70" fill="url(#mk-emerald-glow)" opacity="0.35"/>

  <g filter="url(#mk-3d-shadow)">
    <!-- Base 3D Faceted Shield Frame -->
    <polygon points="100,16 168,46 182,106 160,166 100,186 40,166 18,106 32,46" fill="url(#mk-gold-shine)"/>
    
    <!-- Inner Dark Emerald Bevel -->
    <polygon points="100,22 162,50 174,104 154,160 100,180 46,160 26,104 38,50" fill="#062419"/>
    
    <!-- Brilliant Emerald Crystal Shield Body -->
    <polygon points="100,28 156,54 166,102 148,154 100,172 52,154 34,102 44,54" fill="url(#mk-emerald-vibrant)"/>

    <!-- Facet Glass Reflection Shards -->
    <polygon points="100,28 156,54 100,95 44,54" fill="#FFFFFF" opacity="0.25"/>
    <polygon points="44,54 100,95 34,102" fill="#FFFFFF" opacity="0.15"/>
    <polygon points="156,54 100,95 166,102" fill="#000000" opacity="0.2"/>
    <polygon points="100,95 148,154 100,172 52,154" fill="#023825" opacity="0.7"/>

    <!-- Inner Golden Crest Rim -->
    <polygon points="100,42 142,65 148,105 136,145 100,160 64,145 52,105 58,65" fill="#072017" stroke="url(#mk-gold-top)" stroke-width="2"/>

    <!-- 3D Gleaming Royal Crown -->
    <g transform="translate(0, -2)">
      <!-- Crown Base Band -->
      <path d="M62 118 L138 118 L132 126 L68 126 Z" fill="url(#mk-gold-shine)"/>
      <line x1="64" y1="122" x2="136" y2="122" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>

      <!-- Crown Golden Body & Spires -->
      <polygon points="62,118 60,82 82,104 100,72 118,104 140,82 138,118" fill="url(#mk-gold-shine)"/>
      <!-- Spires 3D Shading -->
      <polygon points="100,72 108,104 100,118 92,104" fill="url(#mk-gold-top)"/>
      <polygon points="60,82 72,104 62,118" fill="#F59E0B"/>
      <polygon points="140,82 128,104 138,118" fill="#B45309"/>

      <!-- Crown Diamonds & Gems -->
      <circle cx="100" cy="72" r="5" fill="#FFFFFF"/>
      <circle cx="100" cy="72" r="3" fill="#72FFC2"/>
      <circle cx="60" cy="82" r="3.5" fill="#FFFFFF"/>
      <circle cx="140" cy="82" r="3.5" fill="#FFFFFF"/>
      <circle cx="100" cy="122" r="2.5" fill="#00FF87"/>
      <circle cx="80" cy="122" r="2.5" fill="#FFD700"/>
      <circle cx="120" cy="122" r="2.5" fill="#FFD700"/>
    </g>

    <!-- 3D Ascending Polished Golden Staircase (Merdiven) -->
    <g transform="translate(0, 10)">
      <!-- Step 1 (Bottom) -->
      <polygon points="70,144 130,144 136,152 64,152" fill="url(#mk-gold-top)"/>
      <polygon points="64,152 136,152 136,157 64,157" fill="#784E0C"/>
      <line x1="66" y1="145" x2="134" y2="145" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9"/>

      <!-- Step 2 -->
      <polygon points="76,134 124,134 129,141 71,141" fill="url(#mk-gold-top)"/>
      <polygon points="71,141 129,141 129,144 71,144" fill="#8A5A0F"/>
      <line x1="73" y1="135" x2="127" y2="135" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9"/>

      <!-- Step 3 -->
      <polygon points="82,124 118,124 122,131 78,131" fill="url(#mk-gold-top)"/>
      <polygon points="78,131 122,131 122,134 78,134" fill="#996515"/>
      <line x1="80" y1="125" x2="120" y2="125" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9"/>

      <!-- Step 4 (Top Summit Step) -->
      <polygon points="88,114 112,114 116,121 84,121" fill="url(#mk-gold-shine)"/>
      <polygon points="84,121 116,121 116,124 84,124" fill="#B45309"/>
      <line x1="86" y1="115" x2="114" y2="115" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9"/>
    </g>

    <!-- Top Apex Diamond Prism -->
    <polygon points="100,16 108,28 100,26 92,28" fill="#FFFFFF"/>
    <polygon points="100,20 105,27 100,26 95,27" fill="#72FFC2"/>
  </g>
</svg>
