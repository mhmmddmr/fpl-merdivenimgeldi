<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="c-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF500"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="c-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
    <linearGradient id="c-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120B24"/>
      <stop offset="50%" stop-color="#090514"/>
      <stop offset="100%" stop-color="#04020A"/>
    </linearGradient>
    <filter id="c-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00FFA3" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#c-glow)">
    <!-- Outer Obsidian Hexagon Frame -->
    <polygon points="100,12 175,55 175,145 100,188 25,145 25,55" fill="url(#c-dark)" stroke="url(#c-gold)" stroke-width="2.5"/>
    
    <!-- Inner Radiant Cyber Contour -->
    <polygon points="100,22 165,60 165,140 100,178 35,140 35,60" fill="#06030E" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

    <!-- Cyber Laser Grid Background -->
    <line x1="100" y1="22" x2="100" y2="178" stroke="url(#c-neon)" stroke-width="1" opacity="0.3"/>
    <line x1="35" y1="100" x2="165" y2="100" stroke="url(#c-neon)" stroke-width="1" opacity="0.2"/>

    <!-- Geometric Radiant Crown Crest -->
    <path d="M55 90 L75 125 L100 110 L125 125 L145 90 L125 135 L75 135 Z" fill="none" stroke="url(#c-gold)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Crown Apex Spires & Laser Core -->
    <line x1="100" y1="65" x2="100" y2="110" stroke="url(#c-gold)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="100,56 106,66 94,66" fill="url(#c-neon)"/>
    <polygon points="55,82 60,90 50,90" fill="url(#c-gold)"/>
    <polygon points="145,82 150,90 140,90" fill="url(#c-gold)"/>

    <!-- Ascending Cyber Ladder Laser Bars -->
    <line x1="72" y1="144" x2="128" y2="144" stroke="url(#c-neon)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="78" y1="154" x2="122" y2="154" stroke="url(#c-neon)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="84" y1="164" x2="116" y2="164" stroke="url(#c-neon)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Top & Bottom Radiant Energy Nodes -->
    <circle cx="100" cy="12" r="3.5" fill="#00FFA3"/>
    <circle cx="100" cy="188" r="3.5" fill="#FFF500"/>
    <circle cx="25" cy="100" r="2.5" fill="#00F0FF"/>
    <circle cx="175" cy="100" r="2.5" fill="#00F0FF"/>
  </g>
</svg>
