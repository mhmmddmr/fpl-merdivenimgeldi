<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cr-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0FFFF"/>
      <stop offset="40%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="cr-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08182B"/>
      <stop offset="50%" stop-color="#040C17"/>
      <stop offset="100%" stop-color="#02060C"/>
    </linearGradient>
    <filter id="cr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#cr-glow)">
    <!-- Aerodynamic Obsidian Shield -->
    <polygon points="100,10 178,48 162,152 100,190 38,152 22,48" fill="url(#cr-dark)" stroke="url(#cr-cyan)" stroke-width="2.5"/>
    
    <!-- Inner Cyber Contour -->
    <polygon points="100,20 168,52 154,144 100,180 46,144 32,52" fill="#030811" stroke="rgba(0,240,255,0.15)" stroke-width="1.5"/>

    <!-- Supersonic Cyber Jet / Rocket Arrowhead -->
    <g transform="translate(0, -5)">
      <!-- Plasma Thruster Trails -->
      <line x1="100" y1="120" x2="100" y2="168" stroke="url(#cr-cyan)" stroke-width="4" stroke-linecap="round"/>
      <line x1="90" y1="125" x2="85" y2="152" stroke="url(#cr-cyan)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <line x1="110" y1="125" x2="115" y2="152" stroke="url(#cr-cyan)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

      <!-- Main Swept Wings -->
      <path d="M100 35 L145 115 L125 118 L100 102 L75 118 L55 115 Z" fill="none" stroke="url(#cr-cyan)" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Inner Fuselage Core -->
      <polygon points="100,48 114,96 100,105 86,96" fill="#041224" stroke="url(#cr-cyan)" stroke-width="2"/>
      <polygon points="100,60 107,82 100,90 93,82" fill="#00F0FF"/>

      <!-- Wingtip Energy Cannons -->
      <circle cx="145" cy="115" r="2.5" fill="#FFFFFF"/>
      <circle cx="55" cy="115" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- Ascending Vertical Velocity Chevrons -->
    <path d="M82 145 L100 132 L118 145" fill="none" stroke="url(#cr-cyan)" stroke-width="3" stroke-linecap="round"/>
    <path d="M86 156 L100 146 L114 156" fill="none" stroke="url(#cr-cyan)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M90 166 L100 158 L110 166" fill="none" stroke="url(#cr-cyan)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Apex Laser Node -->
    <circle cx="100" cy="10" r="3.5" fill="#00F0FF"/>
  </g>
</svg>
