<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Soft Elegant Studio Lighting Background -->
    <radialGradient id="rt-soft-bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2a3563"/>
      <stop offset="50%" stop-color="#192042"/>
      <stop offset="100%" stop-color="#0d1126"/>
    </radialGradient>

    <!-- Electric Cyan Crystal Gradient -->
    <linearGradient id="rt-cyan-vibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6FAFF"/>
      <stop offset="25%" stop-color="#00F0FF"/>
      <stop offset="70%" stop-color="#0094FF"/>
      <stop offset="100%" stop-color="#004DA6"/>
    </linearGradient>

    <!-- Polished Shiny Chrome / Platinum Gradient -->
    <linearGradient id="rt-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="85%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <radialGradient id="rt-cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="rt-3d-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00F0FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Soft Ambient Backdrop -->
  <rect width="200" height="200" rx="36" fill="url(#rt-soft-bg)"/>
  
  <!-- Ambient Plasma Glow -->
  <circle cx="100" cy="95" r="70" fill="url(#rt-cyan-glow)" opacity="0.35"/>

  <g filter="url(#rt-3d-shadow)">
    <!-- Aerodynamic 3D Shield Frame -->
    <polygon points="100,16 172,48 160,154 100,186 40,154 28,48" fill="url(#rt-cyan-vibrant)"/>
    
    <!-- Dark Titanium Inner Bevel -->
    <polygon points="100,22 165,52 154,148 100,180 46,148 35,52" fill="#0C1B2E"/>
    
    <!-- Deep Sapphire Crystal Shield -->
    <polygon points="100,28 158,56 148,142 100,172 52,142 42,56" fill="url(#rt-cyan-vibrant)"/>

    <!-- Crystal Facet Reflections -->
    <polygon points="100,28 158,56 100,98 42,56" fill="#FFFFFF" opacity="0.3"/>
    <polygon points="42,56 100,98 52,142" fill="#FFFFFF" opacity="0.15"/>
    <polygon points="100,98 148,142 100,172 52,142" fill="#04203D" opacity="0.7"/>

    <!-- Inner Shield Cavity -->
    <polygon points="100,42 144,68 136,132 100,156 64,132 56,68" fill="#041221" stroke="#00F0FF" stroke-width="1.5" opacity="0.8"/>

    <!-- 3D Supersonic Chrome Rocket / Arrowhead Dart -->
    <g transform="translate(0, -6)">
      <!-- Blazing Plasma Thruster Exhaust -->
      <polygon points="100,172 112,132 100,140 88,132" fill="url(#rt-cyan-vibrant)"/>
      <polygon points="100,162 106,135 100,140 94,135" fill="#FFFFFF"/>
      <line x1="100" y1="140" x2="100" y2="175" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

      <!-- Swept Chrome Wings -->
      <polygon points="100,52 146,122 128,126 100,110 72,126 54,122" fill="url(#rt-chrome)"/>
      <polygon points="100,52 146,122 128,126 100,110" fill="#FFFFFF" opacity="0.35"/>
      <line x1="100" y1="52" x2="146" y2="122" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="100" y1="52" x2="54" y2="122" stroke="#FFFFFF" stroke-width="1.5"/>

      <!-- Fuselage 3D Body -->
      <polygon points="100,38 120,105 100,118 80,105" fill="url(#rt-cyan-vibrant)"/>
      <!-- Fuselage Specular Spine -->
      <polygon points="100,38 108,100 100,112 92,100" fill="#FFFFFF"/>
      <line x1="100" y1="40" x2="100" y2="112" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Center Power Crystal -->
      <polygon points="100,74 108,86 100,96 92,86" fill="#00F0FF" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>

    <!-- Ascending Triple Chevrons -->
    <path d="M84 148 L100 136 L116 148" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M88 158 L100 148 L112 158" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M92 167 L100 159 L108 167" fill="none" stroke="#0094FF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Apex Diamond Light -->
    <polygon points="100,16 106,26 100,24 94,26" fill="#FFFFFF"/>
  </g>
</svg>
