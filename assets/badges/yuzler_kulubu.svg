<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cyk-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70FFB8"/>
      <stop offset="50%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#00A859"/>
    </linearGradient>
    <linearGradient id="cyk-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF500"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="cyk-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A2419"/>
      <stop offset="50%" stop-color="#04120C"/>
      <stop offset="100%" stop-color="#010604"/>
    </linearGradient>
    <filter id="cyk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00FF87" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#cyk-glow)">
    <!-- Octagonal Cyber Diamond Shield -->
    <polygon points="100,10 172,48 172,152 100,190 28,152 28,48" fill="url(#cyk-dark)" stroke="url(#cyk-emerald)" stroke-width="2.5"/>
    
    <!-- Inner Cyber Matrix Border -->
    <polygon points="100,20 162,54 162,146 100,180 38,146 38,54" fill="#030A07" stroke="rgba(0,255,135,0.15)" stroke-width="1.5"/>

    <!-- Geometric Multi-Cut Emerald Diamond Core -->
    <g transform="translate(0, 5)">
      <!-- Outer Gem Contour -->
      <polygon points="100,45 145,78 128,142 100,158 72,142 55,78" fill="none" stroke="url(#cyk-emerald)" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Inner Facet Laser Vectors -->
      <polygon points="100,58 128,80 100,100 72,80" fill="#062115" stroke="url(#cyk-emerald)" stroke-width="2"/>
      
      <!-- Facet Junctions -->
      <line x1="100" y1="58" x2="100" y2="45" stroke="url(#cyk-emerald)" stroke-width="2"/>
      <line x1="128" y1="80" x2="145" y2="78" stroke="url(#cyk-emerald)" stroke-width="2"/>
      <line x1="72" y1="80" x2="55" y2="78" stroke="url(#cyk-emerald)" stroke-width="2"/>
      <line x1="100" y1="100" x2="100" y2="158" stroke="url(#cyk-emerald)" stroke-width="2"/>
      <line x1="128" y1="80" x2="128" y2="142" stroke="url(#cyk-emerald)" stroke-width="2"/>
      <line x1="72" y1="80" x2="72" y2="142" stroke="url(#cyk-emerald)" stroke-width="2"/>

      <!-- Glowing Center Core Node -->
      <circle cx="100" cy="100" r="4" fill="#FFFFFF"/>
    </g>

    <!-- 3 Cyber Victory Laser Stars at Summit -->
    <polygon points="100,20 103,26 109,26 104,30 106,36 100,32 94,36 96,30 91,26 97,26" fill="url(#cyk-gold)"/>
    <polygon points="76,28 78,33 83,33 79,36 81,41 76,38 71,41 73,36 69,33 74,33" fill="url(#cyk-gold)" opacity="0.8"/>
    <polygon points="124,28 126,33 131,33 127,36 129,41 124,38 119,41 121,36 117,33 122,33" fill="url(#cyk-gold)" opacity="0.8"/>

    <!-- Lateral Energy Nodes -->
    <circle cx="28" cy="100" r="2.5" fill="#00FF87"/>
    <circle cx="172" cy="100" r="2.5" fill="#00FF87"/>
  </g>
</svg>
