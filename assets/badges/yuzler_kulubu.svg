<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Soft Elegant Studio Lighting Background -->
    <radialGradient id="yk-soft-bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#244436"/>
      <stop offset="50%" stop-color="#142920"/>
      <stop offset="100%" stop-color="#0a1712"/>
    </radialGradient>

    <!-- Super Shiny 24K Polished Gold Gradient -->
    <linearGradient id="yk-gold-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#FFF4A3"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#E5A100"/>
      <stop offset="90%" stop-color="#B37400"/>
      <stop offset="100%" stop-color="#664000"/>
    </linearGradient>

    <!-- Vibrant Multi-Cut Emerald Gradient -->
    <linearGradient id="yk-emerald-vibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99FFD1"/>
      <stop offset="30%" stop-color="#00FF87"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#024D34"/>
    </linearGradient>

    <radialGradient id="yk-emerald-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0"/>
    </radialGradient>

    <filter id="yk-3d-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00FF87" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Soft Ambient Backdrop -->
  <rect width="200" height="200" rx="36" fill="url(#yk-soft-bg)"/>
  
  <!-- Ambient Gemstone Glow -->
  <circle cx="100" cy="95" r="70" fill="url(#yk-emerald-glow)" opacity="0.35"/>

  <g filter="url(#yk-3d-shadow)">
    <!-- Hexagonal Gold Shield Frame -->
    <polygon points="100,16 172,50 172,150 100,186 28,150 28,50" fill="url(#yk-gold-shine)"/>
    
    <!-- Dark Titanium Inner Bevel -->
    <polygon points="100,22 165,54 165,146 100,180 35,146 35,54" fill="#0A1C14"/>
    
    <!-- Deep Emerald Crystal Field -->
    <polygon points="100,28 158,58 158,142 100,174 42,142 42,58" fill="url(#yk-emerald-vibrant)"/>

    <!-- Polished 3D Gold Laurel Wreath -->
    <g fill="url(#yk-gold-shine)" opacity="0.95">
      <!-- Left Laurel Leaves -->
      <path d="M50 95 Q38 80 48 70 Q54 82 50 95 Z" stroke="#664000" stroke-width="0.5"/>
      <path d="M48 115 Q34 105 44 92 Q52 105 48 115 Z" stroke="#664000" stroke-width="0.5"/>
      <path d="M54 135 Q40 128 48 115 Q58 126 54 135 Z" stroke="#664000" stroke-width="0.5"/>
      <path d="M66 150 Q52 146 60 135 Q70 142 66 150 Z" stroke="#664000" stroke-width="0.5"/>

      <!-- Right Laurel Leaves -->
      <path d="M150 95 Q162 80 152 70 Q146 82 150 95 Z" stroke="#664000" stroke-width="0.5"/>
      <path d="M152 115 Q166 105 156 92 Q148 105 152 115 Z" stroke="#664000" stroke-width="0.5"/>
      <path d="M146 135 Q160 128 152 115 Q142 126 146 135 Z" stroke="#664000" stroke-width="0.5"/>
      <path d="M134 150 Q148 146 140 135 Q130 142 134 150 Z" stroke="#664000" stroke-width="0.5"/>
    </g>

    <!-- Master Faceted Emerald Gemstone Centerpiece -->
    <g transform="translate(0, 4)">
      <!-- Outer Diamond Contour with White Specular Edge -->
      <polygon points="100,48 144,82 128,144 100,162 72,144 56,82" fill="url(#yk-emerald-vibrant)" stroke="#FFFFFF" stroke-width="1.8"/>
      
      <!-- Diamond Facets with Dynamic Shading -->
      <!-- Table Facet (Top Center) -->
      <polygon points="100,58 126,82 100,102 74,82" fill="#99FFD1" opacity="0.85"/>
      <line x1="74" y1="82" x2="126" y2="82" stroke="#FFFFFF" stroke-width="1.2"/>

      <!-- Star & Crown Facets -->
      <polygon points="100,58 144,82 126,82" fill="#00FF87"/>
      <polygon points="100,58 56,82 74,82" fill="#72FFC2"/>

      <!-- Pavilion Facets (Lower) -->
      <polygon points="126,82 144,82 128,144" fill="#024D34"/>
      <polygon points="74,82 56,82 72,144" fill="#036645"/>
      <polygon points="100,102 126,82 128,144 100,162" fill="#059669"/>
      <polygon points="100,102 74,82 72,144 100,162" fill="#00FF87"/>

      <!-- Center Cut Sparkle Lines -->
      <line x1="100" y1="58" x2="100" y2="162" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
      <circle cx="100" cy="102" r="3" fill="#FFFFFF"/>
    </g>

    <!-- 3 Brilliant 24K Gold Victory Stars at Summit -->
    <!-- Center Star -->
    <g transform="translate(100, 24)">
      <polygon points="0,-10 3,-3 10,-3 4,2 7,9 0,5 -7,9 -4,2 -10,-3 -3,-3" fill="url(#yk-gold-shine)"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    </g>
    <!-- Left Star -->
    <g transform="translate(76, 32)">
      <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="url(#yk-gold-shine)"/>
    </g>
    <!-- Right Star -->
    <g transform="translate(124, 32)">
      <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="url(#yk-gold-shine)"/>
    </g>
  </g>
</svg>
