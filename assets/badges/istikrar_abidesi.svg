<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cia-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0ABFC"/>
      <stop offset="40%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="cia-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF500"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="cia-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#200A38"/>
      <stop offset="50%" stop-color="#0E031A"/>
      <stop offset="100%" stop-color="#040108"/>
    </linearGradient>
    <filter id="cia-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C084FC" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#cia-glow)">
    <!-- Circular Aegis Cyber Rim -->
    <circle cx="100" cy="100" r="88" fill="url(#cia-dark)" stroke="url(#cia-purple)" stroke-width="2.5"/>
    
    <!-- Inner Dark Violet Zone -->
    <circle cx="100" cy="100" r="80" fill="#08020F" stroke="rgba(192,132,252,0.15)" stroke-width="1.5"/>

    <!-- 4 Cardinal Laser Notches -->
    <polygon points="100,12 104,24 96,24" fill="url(#cia-gold)"/>
    <polygon points="100,188 104,176 96,176" fill="url(#cia-gold)"/>
    <polygon points="12,100 24,104 24,96" fill="url(#cia-gold)"/>
    <polygon points="188,100 176,104 176,96" fill="url(#cia-gold)"/>

    <!-- Concentric Laser Target Rings -->
    <circle cx="100" cy="100" r="62" fill="none" stroke="url(#cia-purple)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.5"/>
    <circle cx="100" cy="100" r="46" fill="none" stroke="url(#cia-purple)" stroke-width="2.5" opacity="0.8"/>
    <circle cx="100" cy="100" r="28" fill="none" stroke="url(#cia-gold)" stroke-width="2.5"/>
    <circle cx="100" cy="100" r="14" fill="#2E0A4E" stroke="url(#cia-purple)" stroke-width="2"/>
    <circle cx="100" cy="100" r="5" fill="#FFFFFF"/>

    <!-- Crosshair Target Laser Grid -->
    <line x1="100" y1="28" x2="100" y2="172" stroke="url(#cia-purple)" stroke-width="1.5" opacity="0.6"/>
    <line x1="28" y1="100" x2="172" y2="100" stroke="url(#cia-purple)" stroke-width="1.5" opacity="0.6"/>

    <!-- Precision Arrow Laser Piercing Dead Center -->
    <g transform="rotate(45 100 100)">
      <line x1="100" y1="25" x2="100" y2="110" stroke="url(#cia-gold)" stroke-width="3" stroke-linecap="round"/>
      <polygon points="100,105 107,90 100,95 93,90" fill="url(#cia-gold)"/>
      <polygon points="100,25 110,38 100,44 90,38" fill="url(#cia-gold)"/>
    </g>
  </g>
</svg>
