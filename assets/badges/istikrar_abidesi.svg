<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Soft Elegant Studio Lighting Background -->
    <radialGradient id="ia-soft-bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#462468"/>
      <stop offset="50%" stop-color="#28133d"/>
      <stop offset="100%" stop-color="#140821"/>
    </radialGradient>

    <!-- Super Shiny 24K Polished Gold Gradient -->
    <linearGradient id="ia-gold-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#FFF4A3"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#E5A100"/>
      <stop offset="90%" stop-color="#B37400"/>
      <stop offset="100%" stop-color="#664000"/>
    </linearGradient>

    <!-- Vibrant Amethyst / Magenta Gradient -->
    <linearGradient id="ia-purple-vibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0FE"/>
      <stop offset="25%" stop-color="#E879F9"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>

    <radialGradient id="ia-purple-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E879F9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0"/>
    </radialGradient>

    <filter id="ia-3d-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#E879F9" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Soft Ambient Backdrop -->
  <rect width="200" height="200" rx="36" fill="url(#ia-soft-bg)"/>
  
  <!-- Ambient Amethyst Glow -->
  <circle cx="100" cy="95" r="70" fill="url(#ia-purple-glow)" opacity="0.35"/>

  <g filter="url(#ia-3d-shadow)">
    <!-- Circular 3D Aegis Gold Rim -->
    <circle cx="100" cy="100" r="84" fill="url(#ia-gold-shine)"/>
    
    <!-- Dark Violet Titanium Inner Ring -->
    <circle cx="100" cy="100" r="78" fill="#1C0A2E"/>
    
    <!-- Deep Amethyst Shield Center -->
    <circle cx="100" cy="100" r="72" fill="url(#ia-purple-vibrant)"/>

    <!-- Specular Shield Reflection -->
    <path d="M40 55 Q100 20 160 55 Q100 80 40 55 Z" fill="#FFFFFF" opacity="0.25"/>

    <!-- 4 Cardinal Gold Notches (North, South, East, West) -->
    <polygon points="100,18 106,28 94,28" fill="url(#ia-gold-shine)"/>
    <polygon points="100,182 106,172 94,172" fill="url(#ia-gold-shine)"/>
    <polygon points="18,100 28,106 28,94" fill="url(#ia-gold-shine)"/>
    <polygon points="182,100 172,106 172,94" fill="url(#ia-gold-shine)"/>

    <!-- Concentric Precision Target Rings -->
    <!-- Ring 1 (Outer) -->
    <circle cx="100" cy="100" r="58" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <!-- Ring 2 -->
    <circle cx="100" cy="100" r="44" fill="none" stroke="url(#ia-gold-shine)" stroke-width="3"/>
    <!-- Ring 3 -->
    <circle cx="100" cy="100" r="28" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <!-- Bullseye Center Circle -->
    <circle cx="100" cy="100" r="14" fill="url(#ia-gold-shine)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="100" cy="100" r="5" fill="#FFFFFF"/>

    <!-- Crosshair Alignment Vectors -->
    <line x1="100" y1="36" x2="100" y2="164" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
    <line x1="36" y1="100" x2="164" y2="100" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>

    <!-- 3D 24K Gold Precision Dart / Arrow Dead-Center -->
    <g transform="rotate(45 100 100)">
      <!-- Arrow Shaft -->
      <line x1="100" y1="24" x2="100" y2="108" stroke="url(#ia-gold-shine)" stroke-width="4" stroke-linecap="round"/>
      <line x1="100" y1="24" x2="100" y2="108" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      
      <!-- Arrow Tip -->
      <polygon points="100,108 110,88 100,95 90,88" fill="url(#ia-gold-shine)"/>
      <polygon points="100,108 105,90 100,95 95,90" fill="#FFFFFF"/>

      <!-- Arrow Fletchings (Feathers) -->
      <polygon points="100,24 114,38 100,45 86,38" fill="url(#ia-gold-shine)"/>
      <polygon points="100,36 112,48 100,53 88,48" fill="url(#ia-gold-shine)"/>
    </g>
  </g>
</svg>
